services:
  wamora:
    build: .
    # internal only — public traffic goes through Caddy (80/443)
    expose:
      - "3000"
    volumes:
      - wamora-data:/app/server-data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - wamora
    restart: unless-stopped

volumes:
  wamora-data:
  caddy-data:
  caddy-config:
